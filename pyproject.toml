[project]
name = "perception-data-stack"
version = "0.1.0"
description = "Config-driven perception dataset engine"
readme = "README.md"
requires-python = ">=3.10"

# Core Engine Requirements (The "Must-Haves")
dependencies = [
    "hydra-core>=1.3.2",
    "hydra-zen>=0.12.0",
    "pydantic>=2.7.0",
    "loguru>=0.7.2",
    "rich>=13.7.1",
]

# DATA is a "feature" of the tool, so keep it as an extra
[project.optional-dependencies]
data = []

# DEV is "maintenance" for the tool, so use a group
[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
    "black>=24.0.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
]

[tool.uv]
managed = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

### This part tells Hatch to find that we have a package in the src/ directory
[tool.hatch.build.targets.wheel]
packages = ["src/perception_stack"]

[tool.ruff]
line-length = 100
target-version = "py310"
# src layout support
src = ["src"]

[tool.ruff.lint]
# E: pycodestyle, F: Pyflakes, I: isort, N: pep8-naming, UP: pyupgrade
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["D100", "D104"] # Ignore missing docstrings in public modules/packages

[tool.ruff.lint.isort]
known-first-party = ["perception_stack"]

[tool.mypy]
python_version = "3.10"
files = ["src", "scripts"]
strict = true
ignore_missing_imports = true

# Specifically handle pydantic
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "hydra.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "omegaconf.*"
ignore_missing_imports = true

### Pytest tooling
[tool.pytest.ini_options]
# Tell pytest where the tests are
testpaths = ["tests"]
# Make the output readable and concise (verbose, short tracebacks)
addopts = "-v --tb=short"
