# DatasetConfig
# Describes the dataset artifact being built.
#
# Required fields:
# - name: non-empty dataset name
# - version: str - semantic version string in MAJOR.MINOR.PATCH format, e.g. "0.1.0"
#
# Optional fields:
# - description: human-readable description
#
# Unknown fields are rejected.

name: demo
version: "0.1.0"
description: No-op demo dataset for config validation.
